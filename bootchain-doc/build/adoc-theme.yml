extends: default
page:
  margin: [0.5in, 0.5in, 0.75in, 0.5in]
footer:
  margin: [0, 0, 0, 0]
  background-image: image:../images/footer.jpg[fit=fill]
  height: 0.32in
  recto:
    left:
      content: '{chapter-title}'
    right:
      content: '{page-number}'
      font_style: bold
  verso:
    left:
      content: '{chapter-title}'
    right:
      content: '{page-number}'
      font_style: bold
base:
  font-size: 11
title-page:
  background-image: image::../images/title.jpg[fit=fill]
  title:
    top: 70%
    font_size: floor($base_font_size * 2.0)
  authors:
    delimiter: '<br />'
    content:
      with_email: '{author} <{email}>'
table:
  head:
    background-color: #F0F0F0
